name: Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching the app version, for example v7.0.0'
        required: true
        default: v7.0.0
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source and requested version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/audit.py
          if ($LASTEXITCODE -ne 0) { throw 'Publication audit failed' }
          $source = Get-Content Studio.cs -Raw
          $version = [regex]::Match($source, 'AssemblyFileVersion\("(\d+\.\d+\.\d+)\.\d+"\)').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match the app version' }
          if (-not (Test-Path -LiteralPath "releases/$env:RELEASE_TAG.md")) { throw 'Release notes are missing' }
      - name: Download verified engine and compile
        shell: pwsh
        run: |
          ./scripts/get-engine.ps1
          ./build.ps1
      - name: Real media integration tests
        shell: pwsh
        run: |
          $test = Start-Process ./TwitchGrab-Studio.exe -ArgumentList '--self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw 'Application tests failed' }
          $report = Get-Content studio-test.txt -Raw
          if ($report.Contains('FAIL') -or -not $report.Contains('PASS V4 project')) { throw 'Incomplete application test report' }
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) { choco install innosetup --no-progress -y }
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" /Q installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          ./scripts/package.ps1
          python scripts/audit.py --payload dist/portable
          if ($LASTEXITCODE -ne 0) { throw 'Payload audit failed' }
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-release
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Create a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists; refusing to replace it' }
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | Select-Object -ExpandProperty FullName
          gh release create "$env:RELEASE_TAG" @files --draft --target "$env:GITHUB_SHA" --title "TwitchGrab Studio $env:RELEASE_TAG" --notes-file "releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
